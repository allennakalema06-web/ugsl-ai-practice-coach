# Operator example; no collector/Alertmanager is deployed by the Blueprint.
global:
  scrape_interval: 30s
rule_files:
  - /etc/prometheus/rules/alerts.yml
scrape_configs:
  - job_name: ugsl-ai-coach
    scheme: https
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/ugsl-metrics-service-token
    static_configs:
      - targets:
          - reviewed-staging-ai.example.invalid
# Configure Alertmanager routing separately after a delivery-provider decision.
