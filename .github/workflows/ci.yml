name: UgSL release gates
"on":
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test-and-container:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: ugsl_ci
          POSTGRES_USER: ugsl_ci
          POSTGRES_PASSWORD: disposable-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ugsl_ci -d ugsl_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      UGSL_TEST_DATABASE_URL: postgresql://ugsl_ci:disposable-ci-only@localhost:5432/ugsl_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Minimal native runtime libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libegl1 libgles2 libglib2.0-0 libportaudio2
      - name: Install test package
        run: python -m pip install --no-cache-dir '.[dev]'
      - name: Native imports and bundled models
        run: |
          python -c "import cv2, mediapipe, psycopg, boto3, prometheus_client"
          python -c "from ugsl_ai_coach.assets import model_paths; model_paths()"
      - name: Real Hand and Pose initialization diagnostics
        run: python -m ugsl_ai_coach.deployment.mediapipe_check
      - name: Complete suite with PostgreSQL
        run: python -m pytest --junitxml=ci-results.xml
      - name: PostgreSQL must execute without skips
        run: python ops/ci/verify_results.py ci-results.xml
      - name: Dependency and whitespace checks
        run: |
          python -m pip check
          git diff --check
      - name: Installed wheel independent of checkout
        run: |
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir /tmp/ugsl-wheel .
          python -m venv /tmp/ugsl-installed
          /tmp/ugsl-installed/bin/python -m pip install /tmp/ugsl-wheel/*.whl
          cd /tmp
          /tmp/ugsl-installed/bin/python -c "import ugsl_ai_coach.main; from ugsl_ai_coach.assets import model_paths; model_paths()"
      - name: Build reusable production image
        run: docker build --tag ugsl-ai-coach:ci .
      - name: Harmless container checks
        run: |
          docker run --rm ugsl-ai-coach:ci python -c "import cv2, mediapipe, psycopg, boto3, prometheus_client; from ugsl_ai_coach.assets import model_paths; model_paths()"
          docker run --rm ugsl-ai-coach:ci python -m ugsl_ai_coach.deployment --help
          docker run --rm ugsl-ai-coach:ci python -m ugsl_ai_coach.deployment migrate --help
          docker run --rm ugsl-ai-coach:ci python -m ugsl_ai_coach.deployment analysis-worker --help
          docker run --rm ugsl-ai-coach:ci python -m ugsl_ai_coach.deployment coaching-worker --help
