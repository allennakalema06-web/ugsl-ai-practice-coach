[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ugsl-ai-practice-coach"
version = "0.1.0"
description = "Service foundation for the Uganda Sign Language AI Practice Coach"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic-settings>=2.7,<3.0",
    "uvicorn>=0.34,<1.0",
    "mediapipe==1.0.1",
    "opencv-contrib-python==5.0.0.93",
    "numpy==2.5.3",
    "psycopg[binary]>=3.2,<4.0",
    "boto3>=1.35,<2.0",
    "prometheus-client>=0.21,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10.0", "httpx>=0.28,<1.0", "PyYAML>=6,<7", "setuptools>=77"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ugsl_ai_coach.infrastructure.postgres" = ["migrations/*.sql"]
"ugsl_ai_coach.assets" = ["*.task", "*.json", "*.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: offline MediaPipe tests using local or packaged model assets", "postgres: requires an explicit UGSL_TEST_DATABASE_URL"]
